<!doctype html>
<html lang="pt-MZ">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Configurações | Administração</title><link rel="stylesheet" href="../../css/variables.css"><link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/components.css"><link rel="stylesheet" href="../../css/admin.css"></head>
  <body class="admin-page"><div class="admin-shell"><aside data-admin-sidebar></aside><div class="admin-main"><header data-admin-topbar></header><main class="admin-content"><div class="admin-heading"><div><h2>Configurações da óptica</h2><p>Estes dados alimentam o header, footer, localização, marcações e links de contacto.</p></div></div><form data-settings-form><div class="config-grid"><section class="admin-panel"><div class="panel-header"><h3>Identidade e contactos</h3></div><div class="panel-body"><div class="form-grid"><div class="form-field form-span-2"><label for="nomeOptica">Nome</label><input id="nomeOptica" name="nomeOptica" required></div><div class="form-field form-span-2"><label for="slogan">Slogan</label><input id="slogan" name="slogan" required></div><div class="form-field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel" required></div><div class="form-field"><label for="whatsapp">WhatsApp</label><input id="whatsapp" name="whatsapp" type="tel" required></div><div class="form-field form-span-2"><label for="facebook">Facebook</label><input id="facebook" name="facebook" type="url" placeholder="https://"></div><div class="form-field form-span-2"><label for="horarioTextual">Horário apresentado</label><input id="horarioTextual" name="horarioTextual" required></div></div></div></section><section class="admin-panel"><div class="panel-header"><h3>Localização e logótipo</h3></div><div class="panel-body"><div class="form-grid"><div class="form-field form-span-2"><label for="endereco">Endereço</label><input id="endereco" name="endereco" required></div><div class="form-field"><label for="latitude">Latitude</label><input id="latitude" name="latitude" type="number" step="any" required></div><div class="form-field"><label for="longitude">Longitude</label><input id="longitude" name="longitude" type="number" step="any" required></div><div class="image-upload form-span-2"><span class="field-label">Logótipo</span><div class="image-preview" data-logo-preview></div><input class="file-input" id="logo-file" type="file" accept="image/*" data-logo-file><div class="upload-actions"><label class="btn btn-secondary btn-small" for="logo-file">Substituir imagem</label><button class="btn btn-secondary btn-small" type="button" data-remove-logo>Remover</button></div></div></div></div></section></div><div class="admin-form-actions"><button class="btn btn-primary" type="submit">Guardar configurações</button></div></form></main></div></div><script type="module" src="../../js/admin/configuracoes.js"></script></body>
</html>
